name: JagX AI backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit + integration tests
        env:
          JAGX_JWT_SECRET: ci-secret-not-for-production-use-only-in-ci
          JAGX_DATA_DIR: /tmp/jagx-ci
        run: python -m pytest -q
