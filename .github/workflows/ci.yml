name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: server
        env:
          JAGX_JWT_SECRET: ci-secret-not-for-production-use-only-in-ci
          JAGX_DATA_DIR: /tmp/jagx-ci
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: End-to-end (mock provider)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start mock LLM
        run: |
          nohup python3 scripts/mock_llm.py --port 11434 > /tmp/mock.log 2>&1 &
          sleep 2
      - name: Start API
        working-directory: server
        env:
          JAGX_JWT_SECRET: ci-secret-not-for-production-use-only-in-ci
          JAGX_DATA_DIR: /tmp/jagx-e2e
          JAGX_LLM_BASE_URL: http://127.0.0.1:11434/v1
          JAGX_LLM_MODEL: mock
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - name: Run end-to-end checks
        run: bash scripts/e2e_check.sh
