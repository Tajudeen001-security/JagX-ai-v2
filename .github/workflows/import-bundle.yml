name: Import JagX v12 bundle

# One-shot importer. Pulls the JagX v12 source bundle and commits it into the
# repository using the workflow's own GITHUB_TOKEN.
#
# It runs either manually (workflow_dispatch) or automatically when the marker
# file .github/import-trigger.txt changes. Pushes made with GITHUB_TOKEN do not
# re-trigger workflows, so this cannot loop.
#
# Delete this file (and the marker) once the import has landed.

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: "Public URL of the jagx-v12.tar.gz bundle"
        required: true
        default: "https://n.uguu.se/xufAORXG.tar.gz"
      bundle_md5:
        description: "Expected MD5 of the bundle (integrity check)"
        required: true
        default: "c688d6313cce64894cb542e5cb82730e"
  push:
    paths:
      - ".github/import-trigger.txt"

permissions:
  contents: write

env:
  BUNDLE_URL: ${{ github.event.inputs.bundle_url || 'https://n.uguu.se/xufAORXG.tar.gz' }}
  BUNDLE_MD5: ${{ github.event.inputs.bundle_md5 || 'c688d6313cce64894cb542e5cb82730e' }}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download bundle
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/jagx-v12.tar.gz "$BUNDLE_URL"
          echo "downloaded $(stat -c%s /tmp/jagx-v12.tar.gz) bytes"

      - name: Verify integrity
        run: |
          set -euo pipefail
          actual=$(md5sum /tmp/jagx-v12.tar.gz | awk '{print $1}')
          echo "md5=$actual"
          if [ "$actual" != "$BUNDLE_MD5" ]; then
            echo "::error::MD5 mismatch — refusing to import"
            exit 1
          fi

      - name: Extract
        run: |
          set -euo pipefail
          mkdir -p /tmp/extract
          tar -xzf /tmp/jagx-v12.tar.gz -C /tmp/extract
          # The bundle contains a top-level jagx-v12/ directory.
          cp -a /tmp/extract/jagx-v12/. ./
          echo "--- imported tree ---"
          find . -maxdepth 2 -not -path './.git/*' | sort | head -80

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "JagX Importer"
          git config user.email "jagx-importer@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat: import JagX v12 — autonomous agent (backend + frontend + docs)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
