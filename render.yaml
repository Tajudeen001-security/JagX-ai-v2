services:
  - type: web
    name: jagx-ai-v2
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: JAGX_LLM_TIMEOUT
        value: "20"
      - key: JAGX_TEMPERATURE
        value: "0.35"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: JAGX_PERMANENT_KEYS
        sync: false
      - key: JAGX_ADMIN_SECRET
        sync: false
